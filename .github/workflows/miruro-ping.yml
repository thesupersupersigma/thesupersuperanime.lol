name: Miruro Keep-Alive Ping

# Pings the primary Miruro API instance every 14 minutes to prevent the
# Render free-tier service from spinning down due to inactivity.
#
# Required GitHub secrets:
#   MIRURO_API_URL — primary Miruro instance base URL

on:
  schedule:
    - cron: "*/14 * * * *" # every 14 minutes
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Miruro
        run: curl -f --max-time 10 "${{ secrets.MIRURO_API_URL }}" || true
