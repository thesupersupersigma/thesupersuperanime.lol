# On a v* tag: the multi-arch image ghcr.io/thesupersupersigma/thesupersuperanime:<version> and :latest.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3 # arm64 is built under emulation
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thesupersupersigma/thesupersuperanime:${{ steps.v.outputs.version }}
            ghcr.io/thesupersupersigma/thesupersuperanime:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
